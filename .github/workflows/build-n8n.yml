name: Build latest n8n image

on:
  schedule:
    - cron: "23 3 * * *"
  push:
    branches:
      - main
    paths:
      - .github/workflows/build-n8n.yml
      - locales/**
      - scripts/apply_i18n_compat.mjs
  workflow_dispatch:
    inputs:
      version:
        description: "Optional stable n8n version, for example 2.34.5"
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: build-n8n-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/n8n

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    steps:
      - name: Check out customizations
        uses: actions/checkout@v4
        with:
          path: customization

      - name: Resolve stable n8n release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          version="${REQUESTED_VERSION#n8n@}"
          if [[ -z "$version" ]]; then
            release_tag="$(gh api repos/n8n-io/n8n/releases/latest --jq .tag_name)"
            version="${release_tag#n8n@}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Unsupported n8n version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_ref=n8n@$version" >> "$GITHUB_OUTPUT"
          echo "Building n8n $version"

      - name: Normalize image name
        id: image
        run: |
          echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Check whether scheduled version already exists
        id: existing
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "schedule" ]] && \
             docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:$VERSION already exists; scheduled build is not needed."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Free runner disk space
        if: steps.existing.outputs.skip != 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check out n8n release
        if: steps.existing.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: n8n-io/n8n
          ref: ${{ steps.release.outputs.source_ref }}
          fetch-depth: 1
          path: n8n-source

      - name: Apply localization compatibility layer
        if: steps.existing.outputs.skip != 'true'
        working-directory: n8n-source
        run: |
          set -euo pipefail
          install -D -m 0644 ../customization/locales/zh.json \
            packages/frontend/@n8n/i18n/src/locales/zh.json
          node ../customization/scripts/apply_i18n_compat.mjs
          git diff --check

      - name: Resolve Node.js and pnpm versions
        if: steps.existing.outputs.skip != 'true'
        id: toolchain
        working-directory: n8n-source
        run: |
          set -euo pipefail
          node_version="$(jq -r '.engines.node' package.json | grep -oE '[0-9]+(\.[0-9]+){1,2}' | head -1)"
          pnpm_version="$(jq -r '.packageManager' package.json | cut -d@ -f2)"
          test -n "$node_version"
          test -n "$pnpm_version"
          echo "node_version=$node_version" >> "$GITHUB_OUTPUT"
          echo "pnpm_version=$pnpm_version" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        if: steps.existing.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node_version }}

      - name: Set up pnpm
        if: steps.existing.outputs.skip != 'true'
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm_version }}

      - name: Install and compile n8n
        if: steps.existing.outputs.skip != 'true'
        working-directory: n8n-source
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          TSC_SKIP_LIB_CHECK: "true"
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm build:n8n

      - name: Set up QEMU
        if: steps.existing.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.existing.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        if: steps.existing.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: n8n-source
          file: n8n-source/docker/images/n8n/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.release.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published manifest
        if: steps.existing.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker buildx imagetools inspect "$IMAGE:latest"

      - name: Write job summary
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          {
            echo "## n8n image"
            echo
            echo "- Version: \`$VERSION\`"
            echo "- Image: \`$IMAGE:$VERSION\`"
            echo "- Latest: \`$IMAGE:latest\`"
            echo "- Scheduled build skipped: \`${{ steps.existing.outputs.skip }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
